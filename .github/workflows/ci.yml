name: BLUMIX CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-tests:
    name: Bash syntax and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash version
        run: bash --version

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/blumix
          for file in lib/*.sh tests/*.sh; do
            bash -n "$file"
          done
          python3 -m py_compile bin/blumix-web.py tests/test_web.py brain/network.py brain/reasoning.py brain/evidence.py brain/cli.py tests/test_brain.py tests/test_brain_atlas.py
          bash -n scripts/launch-atlas-demo.sh

      - name: Run test suite
        shell: bash
        run: bash tests/test_blumix.sh

      - name: Test experimental neural engine
        run: python3 tests/test_brain.py

      - name: Test evidence-aware Atlas cockpit
        run: python3 tests/test_brain_atlas.py

      - name: Test local web panel and API security
        run: python3 tests/test_web.py
